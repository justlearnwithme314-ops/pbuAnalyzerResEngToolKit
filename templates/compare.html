<!DOCTYPE html>

<html>

<body>

<h1>Comparison Tool</h1>

<form
action="/run_compare"
method="post"
enctype="multipart/form-data"
>

<p>Raw Input CSV</p>
<input
type="file"
name="raw"
required
>

<p>Processed CSV</p>
<input
type="file"
name="processed"
required
>

<p>result.csv</p>
<input
type="file"
name="result"
required
>

<br><br>

<button type="submit">
Run Comparison
</button>

</form>

</body>

</html>
