<!DOCTYPE html>
<html>

<head>

    <title>PBU Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>PBU Analysis Suite</h1>

    <div class="card">

        <h2>PBU Analysis</h2>

        <form action="/run"
              method="post"
              enctype="multipart/form-data">

            <label>
                Select CSV file
            </label>

            <br><br>

            <input type="file"
                   name="file"
                   required>

            <br><br>

            <label>

                <input type="radio"
                       name="mode"
                       value="preprocess"
                       checked>

                Preprocess only

            </label>

            <br>

            <label>

                <input type="radio"
                       name="mode"
                       value="full">

                Preprocess + Analyze

            </label>

            <br>

            <label>

                <input type="radio"
                       name="mode"
                       value="analyze">

                Analyze existing processed file

            </label>

            <br><br>

            <button type="submit">
                Run Analysis
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Comparison Tool</h2>

        <p>
            Compare raw data,
            processed data,
            and detected PBUs.
        </p>

        <a href="/compare"
           class="button-link">

            Open Comparison Tool

        </a>

    </div>

    <div class="card">

        <h2>CSV Viewer</h2>

        <p>
            Split large CSV datasets
            into multiple graphs.
        </p>

        <a href="/view"
           class="button-link">

            Open Viewer

        </a>

    </div>

</div>

<script src="{{ url_for('static',
filename='js/script.js') }}"></script>

</body>

</html>
