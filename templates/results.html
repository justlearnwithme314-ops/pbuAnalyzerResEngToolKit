<!DOCTYPE html>
<html>

<head>
    <title>Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>Detected PBUs</h1>
    {{ pbus|safe }}

    <h1>Reservoir Predictions</h1>
    {{ preds|safe }}

    <h1>Plots</h1>
    {% for plot in plots %}
    <img src="/static/plots/{{ plot }}" alt="{{ plot }}">
    {% endfor %}

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
